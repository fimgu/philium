<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filium</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Filium</h1>
      <button id="new-session" title="New session">+</button>
    </header>
    <ul id="sessions"></ul>
    <footer id="status">starting HAL…</footer>
  </aside>
  <main>
    <div id="toolbar">
      <span id="title">No session</span>
      <span id="meta"></span>
      <label><input type="checkbox" id="raw" /> raw events</label>
      <button id="cancel" disabled>Stop</button>
    </div>
    <section id="permissions"></section>
    <section id="timeline"></section>
    <form id="composer">
      <textarea id="input" placeholder="Send a task… (⌘↵)" rows="3" disabled></textarea>
      <button type="submit" id="send" disabled>Send</button>
    </form>
  </main>

  <dialog id="new-dialog">
    <form method="dialog" id="new-form">
      <h2>New session</h2>
      <label>Workspace <input name="workspace" placeholder="/path/to/project" required /></label>
      <label>Model <select name="model"></select></label>
      <label>Tool permissions
        <select name="permission_mode">
          <option value="ask" selected>Ask before risky actions</option>
          <option value="auto_deny">Auto-deny</option>
          <option value="auto_allow">Auto-allow (unsafe)</option>
        </select>
      </label>
      <menu>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok">Create</button>
      </menu>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
